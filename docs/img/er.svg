<g font-weight="bold">
<text x="30" y="38">users</text><text x="340" y="38">students</text><text x="630" y="38">sheets</text>
<text x="630" y="258">marks</text><text x="340" y="258">templates</text><text x="30" y="318">audit_log</text>
<text x="30" y="558">sessions</text><text x="340" y="418">telegram_codes</text><text x="340" y="558">sheet_counters</text>
</g>
<g>
<text x="30" y="65">PK id uuid</text><text x="30" y="85">login text UNIQUE</text><text x="30" y="105">password_hash text</text><text x="30" y="125">name text</text><text x="30" y="145">role student|officer|admin</text><text x="30" y="165">department dept NULL</text><text x="30" y="185">active, must_change_password</text><text x="30" y="205">telegram_chat_id UNIQUE</text><text x="30" y="225">created_at</text>
<text x="340" y="65">PK id uuid</text><text x="340" y="85">FK user_id → users UNIQUE</text><text x="340" y="105">group text</text>
<text x="630" y="65">PK number 'YYYY-NNNN'</text><text x="630" y="85">FK student_id → students</text><text x="630" y="105">type sheet_type</text><text x="630" y="125">FK created_by → users</text><text x="630" y="145">created_at, closed_at</text><text x="630" y="168" font-size="11">UNIQUE(student,type) WHERE open</text>
<text x="630" y="285">PK,FK sheet_number → sheets</text><text x="630" y="305">PK department dept</text><text x="630" y="325">state pending|clear|debt</text><text x="630" y="345">note text ≤ 200</text><text x="630" y="365">due date</text><text x="630" y="385">FK updated_by → users</text><text x="630" y="405">updated_at, updated_by_name</text><text x="630" y="430" font-size="11">CHECK debt ⇒ note NOT NULL</text><text x="630" y="448" font-size="11">CHECK not debt ⇒ note,due NULL</text>
<text x="340" y="285">PK type sheet_type</text><text x="340" y="305">PK department dept</text>
<text x="30" y="345">PK id bigserial</text><text x="30" y="365">at timestamptz</text><text x="30" y="385">FK actor_id → users</text><text x="30" y="405">actor_name text</text><text x="30" y="425">FK sheet_number → sheets</text><text x="30" y="445">department dept</text><text x="30" y="465">action create|clear|debt|close</text><text x="30" y="485">note text</text>
<text x="30" y="585">PK token_hash bytea (sha256)</text><text x="30" y="605">FK user_id → users, expires_at</text>
<text x="340" y="445">PK code text</text><text x="340" y="465">FK user_id → users</text><text x="340" y="485">expires_at</text>
<text x="340" y="585">PK year integer</text><text x="340" y="605">last integer</text>
</g>
