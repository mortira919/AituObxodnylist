openapi: 3.0.3
info:
  title: Электронный обходной лист колледжа AITU
  version: 1.0.0
  description: |
    Контракт между фронтендом (frontend/) и бэкендом. Подробности, правила и модель данных: docs/backend/README.md.
    Все пути ниже относительно базового URL `/api/v1`.
    Аутентификация: сессия в httpOnly-cookie `session`, которую ставит POST /auth/login.
    Ошибки всегда приходят в формате `Error` с машинным кодом.
servers:
  - url: /api/v1

tags:
  - name: auth
  - name: sheets
  - name: queue
  - name: students
  - name: users
  - name: templates
  - name: audit
  - name: telegram
  - name: public

security:
  - session: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Успех. Ставит cookie `session` (HttpOnly, Secure, SameSite=Lax).
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/LoginFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход, сессия удаляется на сервере
      responses:
        '204': { description: Выход выполнен }

  /auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
          description: Пользователь вошёл
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    post:
      tags: [auth]
      summary: Смена своего пароля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, next]
              properties:
                current: { type: string }
                next: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Пароль изменён, остальные сессии пользователя завершены }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sheets:
    get:
      tags: [sheets]
      summary: Список листов (учебная часть видит все, сотрудник отдела только листы своего отдела)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SheetStatus' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SheetType' } }
        - { name: q, in: query, description: Поиск по ФИО, группе или номеру листа, schema: { type: string, maxLength: 100 } }
        - { name: department, in: query, description: Только листы, в которые входит отдел, schema: { $ref: '#/components/schemas/DeptId' } }
        - { name: markState, in: query, description: Состояние отметки отдела из `department`, schema: { $ref: '#/components/schemas/MarkState' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Страница листов, новые сверху
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Sheet' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [sheets]
      summary: Открыть лист (только учебная часть)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, type]
              properties:
                studentId: { type: string }
                type: { $ref: '#/components/schemas/SheetType' }
      responses:
        '201':
          description: Лист открыт, отделы взяты из шаблона типа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sheet' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /sheets/mine:
    get:
      tags: [sheets]
      summary: Листы текущего студента
      responses:
        '200':
          description: Все листы студента, открытые сверху
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Sheet' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sheets/summary:
    get:
      tags: [sheets]
      summary: Сводка для учебной части
      responses:
        '200':
          description: Счётчики
          content:
            application/json:
              schema:
                type: object
                required: [active, withDebt, closed]
                properties:
                  active: { type: integer, description: Открытые листы }
                  withDebt: { type: integer, description: Открытые листы, где есть хотя бы один долг }
                  closed: { type: integer, description: 'Листы, закрытые с 1 января текущего года по времени Asia/Almaty' }

  /sheets/{number}:
    parameters:
      - { $ref: '#/components/parameters/SheetNumber' }
    get:
      tags: [sheets]
      summary: Карточка листа с журналом действий по нему
      responses:
        '200':
          description: Лист
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Sheet' }
                  - type: object
                    required: [audit]
                    properties:
                      audit: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }

  /sheets/{number}/marks/{department}:
    parameters:
      - { $ref: '#/components/parameters/SheetNumber' }
      - { name: department, in: path, required: true, schema: { $ref: '#/components/schemas/DeptId' } }
    put:
      tags: [sheets]
      summary: Поставить отметку отдела (только сотрудник этого отдела)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkInput' }
      responses:
        '200':
          description: Обновлённый лист. Если все отметки стали clear, лист закрыт (closedAt заполнен).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sheet' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /queue/counts:
    get:
      tags: [queue]
      summary: Счётчики очереди отдела текущего сотрудника
      responses:
        '200':
          description: Сколько отметок отдела в каждом состоянии (по всем листам, включая закрытые для clear)
          content:
            application/json:
              schema:
                type: object
                required: [pending, debt, clear]
                properties:
                  pending: { type: integer }
                  debt: { type: integer }
                  clear: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /queue/clear:
    post:
      tags: [queue]
      summary: Массовая отметка «нет задолженности» от отдела текущего сотрудника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numbers]
              properties:
                numbers: { type: array, items: { type: string }, minItems: 1, maxItems: 200 }
      responses:
        '200':
          description: Каждый лист обрабатывается отдельно, ошибка одного не откатывает остальные
          content:
            application/json:
              schema:
                type: object
                required: [updated, failed]
                properties:
                  updated: { type: array, items: { type: string } }
                  failed:
                    type: array
                    items:
                      type: object
                      required: [number, code]
                      properties:
                        number: { type: string }
                        code: { $ref: '#/components/schemas/ErrorCode' }

  /students:
    get:
      tags: [students]
      summary: Справочник студентов (учебная часть)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Страница студентов по алфавиту
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Student' } }
                  total: { type: integer }
    post:
      tags: [students]
      summary: Добавить студента. Сервер создаёт ему учётную запись с временным паролем.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentInput' }
      responses:
        '201':
          description: Временный пароль показывается один раз
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /students/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [students]
      summary: Изменить ФИО или группу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 3, maxLength: 120 }
                group: { type: string, minLength: 2, maxLength: 20 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
          description: Обновлённый студент
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /students/import:
    post:
      tags: [students]
      summary: Импорт студентов из CSV (UTF-8, разделитель «;» или «,», колонки name;group;login)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: До 2 МБ и 2000 строк }
      responses:
        '200':
          description: Созданные учётные записи с временными паролями и пропущенные строки
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped]
                properties:
                  created: { type: array, items: { $ref: '#/components/schemas/Credentials' } }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [line, code]
                      properties:
                        line: { type: integer, description: Номер строки в файле, с 1 }
                        code: { $ref: '#/components/schemas/ErrorCode' }
        '400': { $ref: '#/components/responses/Error' }

  /users:
    get:
      tags: [users]
      summary: Сотрудники (учебная часть). Студенты сюда не входят.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Страница сотрудников
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
                  total: { type: integer }
    post:
      tags: [users]
      summary: Добавить сотрудника отдела или учебной части
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInput' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCredentials' }
          description: Временный пароль показывается один раз
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [users]
      summary: Изменить ФИО, отдел или заблокировать
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 3, maxLength: 120 }
                departmentId: { $ref: '#/components/schemas/DeptId' }
                active: { type: boolean, description: false завершает все сессии пользователя }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
          description: Обновлённый пользователь
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /users/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [users]
      summary: Выдать новый временный пароль (сотруднику или студенту)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                properties:
                  temporaryPassword: { type: string }
          description: Старый пароль и все сессии пользователя больше не действуют

  /templates:
    get:
      tags: [templates]
      summary: Какие отделы входят в лист каждого типа
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Templates' }
          description: Шаблоны всех пяти типов

  /templates/{type}:
    parameters:
      - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/SheetType' } }
    put:
      tags: [templates]
      summary: Изменить шаблон (только учебная часть). Влияет только на новые листы.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departments]
              properties:
                departments: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DeptId' } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Templates' }
          description: Все шаблоны после изменения
        '400': { $ref: '#/components/responses/Error' }

  /audit:
    get:
      tags: [audit]
      summary: Журнал действий (только учебная часть), новые сверху
      parameters:
        - { name: sheet, in: query, description: Номер листа, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  total: { type: integer }
          description: Страница журнала

  /telegram/link:
    post:
      tags: [telegram]
      summary: Получить одноразовый код привязки Telegram (студент)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [code, botUrl, expiresAt]
                properties:
                  code: { type: string, example: '4821' }
                  botUrl: { type: string, example: 'https://t.me/<bot>?start=4821' }
                  expiresAt: { type: string, format: date-time }
          description: Код живёт 15 минут
    delete:
      tags: [telegram]
      summary: Отвязать Telegram
      responses:
        '204': { description: Отвязано }

  /public/verify/{number}:
    parameters:
      - { $ref: '#/components/parameters/SheetNumber' }
    get:
      tags: [public]
      summary: Публичная проверка подлинности по номеру с QR-кода. Без входа, с ограничением частоты.
      security: []
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
          description: Ответ всегда 200, даже если лист не найден, чтобы не раскрывать лишнего
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    SheetNumber: { name: number, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{4}$' } }

  responses:
    Error:
      description: Ошибка бизнес-правила или валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нет сессии или она истекла (code=unauthorized)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Роль не позволяет действие (code=forbidden)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LoginFailed:
      description: Неверный логин или пароль, либо учётная запись заблокирована (code=login_failed). Причину не уточнять.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Слишком много запросов (code=rate_limited), заголовок Retry-After в секундах
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    DeptId:
      type: string
      enum: [library, accounting, dorm, military, it, academic]
      description: library библиотека, accounting бухгалтерия, dorm общежитие, military военно-учётный стол, it IT-отдел, academic учебная часть
    SheetType:
      type: string
      enum: [graduation, expulsion, transfer, leave, dorm]
      description: graduation выпуск, expulsion отчисление, transfer перевод, leave академический отпуск, dorm выселение из общежития
    MarkState:
      type: string
      enum: [pending, clear, debt]
    SheetStatus:
      type: string
      enum: [created, progress, debt, closed]
      description: Вычисляется сервером по отметкам, см. README, правило R11
    Role:
      type: string
      enum: [student, officer, admin]

    User:
      type: object
      required: [id, name, login, role, active, telegramLinked, mustChangePassword]
      properties:
        id: { type: string }
        name: { type: string }
        login: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { $ref: '#/components/schemas/DeptId', description: Только у role=officer }
        studentId: { type: string, description: Только у role=student }
        group: { type: string, description: Только у role=student }
        active: { type: boolean }
        telegramLinked: { type: boolean }
        mustChangePassword: { type: boolean, description: true после выдачи временного пароля; фронт пускает только на смену пароля }

    Student:
      type: object
      required: [id, userId, name, group, login, activeSheets]
      properties:
        id: { type: string }
        userId: { type: string, description: 'Учётная запись студента; фронт передаёт её в POST /users/{id}/reset-password' }
        name: { type: string }
        group: { type: string }
        login: { type: string }
        activeSheets: { type: integer, description: Сколько открытых листов у студента }

    StudentInput:
      type: object
      required: [name, group, login]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        group: { type: string, minLength: 2, maxLength: 20 }
        login: { type: string, pattern: '^[a-z0-9._-]{3,64}$' }

    StaffInput:
      type: object
      required: [name, login, role]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        login: { type: string, pattern: '^[a-z0-9._-]{3,64}$' }
        role: { type: string, enum: [officer, admin] }
        departmentId: { $ref: '#/components/schemas/DeptId', description: Обязателен, если role=officer }

    Credentials:
      type: object
      required: [student, temporaryPassword]
      properties:
        student: { $ref: '#/components/schemas/Student' }
        temporaryPassword: { type: string }

    StaffCredentials:
      type: object
      required: [user, temporaryPassword]
      properties:
        user: { $ref: '#/components/schemas/User' }
        temporaryPassword: { type: string }

    Mark:
      type: object
      required: [department, state]
      properties:
        department: { $ref: '#/components/schemas/DeptId' }
        state: { $ref: '#/components/schemas/MarkState' }
        note: { type: string, maxLength: 200, description: Только при state=debt }
        due: { type: string, format: date, description: Только при state=debt }
        at: { type: string, format: date-time }
        by: { type: string, description: ФИО сотрудника, поставившего отметку }

    MarkInput:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [clear, debt] }
        note: { type: string, maxLength: 200, description: Обязательно при state=debt }
        due: { type: string, format: date, description: Не раньше сегодняшней даты }

    Sheet:
      type: object
      required: [number, type, status, createdAt, student, marks]
      properties:
        number: { type: string, example: '2026-0142' }
        type: { $ref: '#/components/schemas/SheetType' }
        status: { $ref: '#/components/schemas/SheetStatus' }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        student:
          type: object
          required: [id, name, group]
          properties:
            id: { type: string }
            name: { type: string }
            group: { type: string }
        marks: { type: array, items: { $ref: '#/components/schemas/Mark' } }

    Templates:
      type: object
      required: [graduation, expulsion, transfer, leave, dorm]
      additionalProperties: false
      properties:
        graduation: { type: array, items: { $ref: '#/components/schemas/DeptId' } }
        expulsion: { type: array, items: { $ref: '#/components/schemas/DeptId' } }
        transfer: { type: array, items: { $ref: '#/components/schemas/DeptId' } }
        leave: { type: array, items: { $ref: '#/components/schemas/DeptId' } }
        dorm: { type: array, items: { $ref: '#/components/schemas/DeptId' } }

    AuditEntry:
      type: object
      required: [at, actor, sheet, action]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string, description: ФИО или «Система» }
        sheet: { type: string }
        department: { $ref: '#/components/schemas/DeptId' }
        action: { type: string, enum: [create, clear, debt, close] }
        note: { type: string }

    Verification:
      type: object
      required: [found, closed]
      properties:
        found: { type: boolean }
        closed: { type: boolean }
        shortName: { type: string, description: 'Имя и первая буква фамилии: «Айгерим С.». Только если found' }
        number: { type: string, description: Только если closed }
        type: { $ref: '#/components/schemas/SheetType' }
        closedAt: { type: string, format: date-time, description: Только если closed }
        departments: { type: array, items: { $ref: '#/components/schemas/DeptId' }, description: Только если closed }

    ErrorCode:
      type: string
      enum:
        - validation
        - unauthorized
        - forbidden
        - not_found
        - login_failed
        - rate_limited
        - duplicate
        - closed
        - foreign_dept
        - note_required
        - note_too_long
        - due_past
        - no_depts
        - login_taken
        - weak_password
        - wrong_password
        - department_required
        - bad_file
        - server

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Текст для логов и разработчика. Интерфейс показывает свой перевод по code. }
            field: { type: string, description: Поле формы, к которому относится ошибка валидации }
