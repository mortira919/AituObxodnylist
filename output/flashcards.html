<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обходной лист: карточки</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1b1b1b; --muted: #6b6b6b; --line: #d9d9d4;
  --accent: #001c46; --ok: #2f6b3a; --again: #8a3b12; --chip: #ecece8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151515; --card: #1f1f1f; --text: #ececec; --muted: #9a9a9a; --line: #333;
          --accent: #9cc3f5; --ok: #7fbf8a; --again: #e39a6e; --chip: #2a2a2a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
.tab { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 6px; }
.tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid transparent; background: var(--chip); padding: 4px 10px; border-radius: 999px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.bar label { display: flex; align-items: center; gap: 6px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
.progress div { height: 100%; background: var(--ok); width: 0; transition: width .2s; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px 20px;
        min-height: 260px; display: flex; flex-direction: column; cursor: pointer; user-select: none; }
.card .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card .q { font-size: 20px; font-weight: 600; margin: 12px 0; white-space: pre-line; }
.card .a { font-size: 17px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; white-space: pre-line; }
.card .hint { color: var(--muted); font-size: 14px; margin-top: auto; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 12px; border-radius: 8px; font-weight: 600; }
.btn.again { color: var(--again); } .btn.ok { color: var(--ok); }
.small { border: none; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; }
.done { text-align: center; padding: 40px 0; }
.list details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
.list summary { cursor: pointer; font-weight: 600; white-space: pre-line; }
.list p { margin: 8px 0 0; white-space: pre-line; }
.list h2 { font-size: 15px; color: var(--muted); margin: 20px 0 8px; }
.keys { color: var(--muted); font-size: 13px; margin-top: 16px; }
.mark { font-size: 12px; margin-left: 6px; color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Электронный обходной лист: карточки по документации</h1>
  <p class="sub">Карточки по разделам документации, от команды и бизнес-анализа до тестирования. Нажми на карточку, чтобы увидеть ответ.</p>

  <div class="tabs">
    <button class="tab" id="tabCards" aria-pressed="true">Карточки</button>
    <button class="tab" id="tabList" aria-pressed="false">Все вопросы</button>
  </div>
  <div class="chips" id="chips"></div>

  <section id="cardsView">
    <div class="bar">
      <span id="count"></span>
      <label><input type="checkbox" id="onlyNew" checked> только невыученные</label>
      <button class="small" id="shuffle">перемешать</button>
      <button class="small" id="reset">сбросить прогресс</button>
    </div>
    <div class="progress"><div id="progressFill"></div></div>
    <div id="stage"></div>
    <p class="keys">Клавиши: пробел — показать ответ, → знаю, ← ещё раз.</p>
  </section>

  <section id="listView" class="list" hidden></section>
</main>

<script>
const DATA = [
// [раздел, вопрос, ответ]

["1. Команда", "За какие разделы отвечает Зарина?", "2 — бизнес-анализ, 3 — сбор требований и моделирование интервью, 4 — требования с MoSCoW, 5 — сценарии, 6 — управление изменениями."],
["1. Команда", "За какие разделы отвечает Азиз?", "7 — техническая спецификация и схема системы, 10 — реализация и трассировка, 11 — план работ и доска GitHub. Плюс сборка документации."],
["1. Команда", "За какие разделы отвечает Алтынжан?", "7.4 — компоненты сервера, 8 — данные и схема базы, 9 — безопасность. В коде — бэкенд на Go и публикация."],
["1. Команда", "За что отвечает Артём?", "Раздел 12 — тестирование: юнит-тесты, сквозные сценарии, тесты сервера и исправление найденных ошибок."],
["1. Команда", "Роли команды и роли пользователей — в чём разница?", "Роли команды — кто что делал в проекте. Роли пользователей — кто работает в системе: студент, сотрудник отдела, учебная часть и проверяющий без входа."],
["2. Бизнес-анализ", "Какую проблему решает проект?", "Бумажный обходной лист: студент сам обходит 5–7 кабинетов и узнаёт о долге только у двери. Статуса не видно, бланк теряется и подделывается."],
["2. Бизнес-анализ", "Назови проблемы бумажного процесса (их 9).", "1 долг узнаёшь у двери; 2 сотрудника нет на месте; 3 отдел не знает заранее, кто придёт; 4 никто не видит этап листа; 5 бланк теряют и подделывают; 6 нет истории отметок; 7 нет напоминаний о сроках; 8 подлинность проверяют на глаз; 9 колледж не видит сводку."],
["2. Бизнес-анализ", "Когда студенту нужен обходной лист?", "Пять случаев = пять типов листа: выпуск, отчисление, перевод, академический отпуск, выселение из общежития."],
["2. Бизнес-анализ", "Какие 6 отделов ставят отметки?", "Библиотека, бухгалтерия, общежитие, военно-учётный стол, IT-отдел, учебная часть."],
["2. Бизнес-анализ", "Что такое ЭОЛ одной фразой?", "Веб-система: учебная часть открывает лист, все отделы отмечают параллельно, студент видит, кто его держит, закрытый лист проверяется по QR-коду."],
["2. Бизнес-анализ", "Что система делает по шагам?", "Открывает лист одного из 5 типов → лист сразу в очереди каждого отдела → отдел ставит «нет задолженности» или долг с описанием и сроком → студент видит статус и получает Telegram → после всех «нет задолженности» лист закрывается сам → PDF с QR, проверка по номеру."],
["2. Бизнес-анализ", "Кто целевые пользователи и что каждому нужно?", "Студент — знать долги заранее, не ходить зря, получить документ. Сотрудник отдела — видеть свои листы до визита и отмечать быстро. Учебная часть — открывать листы, вести справочники, видеть зависшие. Проверяющий — убедиться, что лист настоящий. Администрация — сводка по листам."],
["2. Бизнес-анализ", "Чем пользователи отличаются друг от друга по устройству?", "Студент чаще с телефона, сотрудники и учебная часть — с рабочего компьютера, проверяющий — с любого устройства и без аккаунта."],
["2. Бизнес-анализ", "Цель проекта?", "Заменить бумажный лист электронным: меньше времени и визитов, долги видны заранее, закрытый лист проверяется без звонков и сверки печатей."],
["2. Бизнес-анализ", "Задачи проекта (их 9)?", "Изучить процесс; определить стороны и потребности; сформулировать требования и приоритеты; подготовить техспецификацию; сделать открытие листов и справочники; очередь отдела; кабинет студента и Telegram; PDF с QR и проверку; протестировать и написать инструкцию запуска."],
["2. Бизнес-анализ", "Цель и задачи — в чём разница?", "Цель — какой результат нужен (заменить бумажный лист). Задачи — конкретные шаги, которые к нему ведут (анализ, требования, спецификация, реализация, тесты)."],
["2. Бизнес-анализ", "Ожидаемые результаты?", "Студент ходит только в отделы с долгом; отделы без долга отмечают дистанционно; учебная часть видит статус каждого листа; подлинность проверяется по QR за секунды; каждое действие в журнале; бумага не нужна."],
["2. Бизнес-анализ", "Что такое SMART?", "Требования к цели: Specific — конкретная, Measurable — измеримая, Achievable — достижимая, Relevant — значимая для проблемы, Time-bound — со сроком."],
["2. Бизнес-анализ", "Наша SMART-цель?", "До 5 ноября 2026 сделать и показать прототип: учебная часть открывает листы 5 типов, 6 отделов ставят отметки, студент видит статус в кабинете и Telegram, получает PDF с QR, подлинность проверяется на публичной странице. Весь сценарий — без обхода кабинетов."],
["2. Бизнес-анализ", "SMART: S и M?", "S — назван продукт, 5 типов листа, 3 роли и проверяющий, результат — PDF с QR. M — 5 типов, 6 отделов, все Must проходят критерии приёмки, сценарий без визитов в отделы без долга."],
["2. Бизнес-анализ", "SMART: A, R и T?", "A — 4 человека, MVP, знакомый стек, без интеграций с 1С и eGov. R — цель закрывает проблемы 1–8 из списка. T — 5 ноября 2026, срок сдачи по графику практики."],
["2. Бизнес-анализ", "Как называется основной бизнес-процесс и что его запускает?", "«Оформление обходного листа при прекращении или изменении статуса обучения студента». Запускается заявлением студента. Результат — лист с отметками всех отделов."],
["2. Бизнес-анализ", "Кто участвует в бизнес-процессе?", "Студент, учебная часть, библиотека, бухгалтерия, общежитие, военно-учётный стол, IT-отдел и проверяющий (отдел кадров или приёмная)."],
["2. Бизнес-анализ", "Что такое AS-IS и TO-BE?", "AS-IS — как процесс работает сейчас. TO-BE — как он будет работать после внедрения системы. Сравнение показывает, что именно улучшается."],
["2. Бизнес-анализ", "AS-IS по шагам?", "Заявление → учебная часть выдаёт бланк → студент обходит кабинеты в любом порядке → сотрудник вручную ищет долг → если его нет на месте, студент приходит снова → долг узнаётся на месте → подпись и печать → бланк сдаётся в учебную часть → бумажный архив → внешняя организация проверяет печать на глаз."],
["2. Бизнес-анализ", "Проблемы AS-IS по этапам?", "Выдача — нет учёта листов. Обход — очереди и график сотрудников. Проверка долга — только при визите. Повторные визиты. Хранение — бумага теряется. Контроль — статус не виден до возврата. Подлинность — подделка. Сводка — нет данных."],
["2. Бизнес-анализ", "TO-BE по шагам?", "Учебная часть открывает лист → система копирует отделы из шаблона и даёт номер ГГГГ-NNNN → отделы сразу видят лист → ставят «нет задолженности» или долг → студент видит долг в кабинете и Telegram → идёт только туда, где долг → последняя отметка закрывает лист → PDF с QR → проверяющий сканирует QR → всё в журнале."],
["2. Бизнес-анализ", "Главное отличие TO-BE от AS-IS?", "Последовательный обход кабинетов заменён параллельными отметками. Студент идёт только туда, где долг."],
["2. Бизнес-анализ", "Что меняется: визиты, долг, сотрудник, статус?", "Визиты: 5–7 и повторные → только в отделы с долгом. О долге: у двери → сразу в кабинете и Telegram. Сотрудник: нужен на месте → отмечает дистанционно. Статус: не виден → в реальном времени."],
["2. Бизнес-анализ", "Что меняется: подлинность, история, бумага?", "Подлинность: печать на глаз → QR и публичная страница. История: нет → журнал всех действий. Бумага: бланк на каждого → не нужна, PDF по запросу."],
["2. Бизнес-анализ", "Что показывает рисунок 1?", "Процесс оформления листа в двух вариантах: AS-IS (последовательный обход кабинетов) и TO-BE (параллельные отметки в системе)."],
["2. Бизнес-анализ", "Кто такие стейкхолдеры и чем они шире пользователей?", "Все, кого проект касается или кто на него влияет. Кроме пользователей это администрация колледжа, руководитель проекта и сама команда."],
["2. Бизнес-анализ", "По каким признакам описаны стейкхолдеры?", "Роль в процессе, участие (постоянное, периодическое, эпизодическое) и влияние (высокое, среднее, низкое), плюс интересы и как они учтены в системе."],
["2. Бизнес-анализ", "У кого из стейкхолдеров высокое влияние?", "Студент, учебная часть, администрация колледжа, руководитель-преподаватель и команда разработки."],
["2. Бизнес-анализ", "Участие и влияние отделов и проверяющего?", "Отделы: участие постоянное, влияние среднее — каждый проверяет свой тип долга. Проверяющий: участие периодическое, влияние низкое."],

["3. Сбор требований", "Что дал каждый метод?", "Моделирование интервью — правила отметок, состав листов, формат долга, доступ. Анализ бланка — 5 типов, 6 отделов, обязательные поля. Опыт студентов — «долг у двери», повторные визиты, нет статуса. Аналоги — электронного обходного в колледжах нет, ориентир на QR-проверку."],

["4. Требования и MoSCoW", "Как определяли приоритет?", "Три вопроса: закрывает ли требование проблему из раздела 2.1, сколько стоит сделать (дни одного человека), какой риск снимает (подделка, утечка, потеря отметки)."],
["4. Требования и MoSCoW", "Какое правило приоритета важнее трудоёмкости?", "Всё, что нужно для доверия к закрытому листу или защиты данных, — Must независимо от трудоёмкости."],
["4. Требования и MoSCoW", "Что такое критерий приёмки и зачем он?", "Проверяемое условие, по которому видно, что требование выполнено. Пример FR-05: повторное открытие даёт duplicate, второй лист не создаётся. По критериям пишутся тесты."],
["4. Требования и MoSCoW", "Что такое MVP и что в него входит?", "Минимальный работающий продукт — все Must: FR-01, FR-02, FR-04–FR-09, FR-11–FR-15, FR-18, FR-19, FR-21 и NFR-01–NFR-08. С ними проходит весь сценарий от открытия листа до проверки по QR."],
["4. Требования и MoSCoW", "Какие функциональные требования — Must?", "Вход (FR-01), смена временного пароля (FR-02), открытие листа (FR-04), нет дублей (FR-05), отделы из шаблона (FR-06), очередь отдела (FR-07), «нет задолженности» (FR-08), долг (FR-09), кабинет студента (FR-11), автозакрытие (FR-12), PDF с QR (FR-13), публичная проверка (FR-14), журнал (FR-15), все листы с фильтрами (FR-18), студенты (FR-19), сотрудники (FR-21)."],
["4. Требования и MoSCoW", "Какие функциональные требования — Should?", "Смена своего пароля (FR-03), массовая отметка (FR-10), поиск по журналу (FR-16), сводка (FR-17), импорт CSV (FR-20), шаблоны (FR-22), Telegram (FR-23), казахский язык (FR-24)."],
["4. Требования и MoSCoW", "Какие требования — Could и что с ними?", "FR-25 — сводка задержек по отделам, FR-26 — напоминания о сроке долга. Не реализованы, перенесены в следующую версию."],
["4. Требования и MoSCoW", "Что в Won't и почему?", "Интеграция с 1С и библиотечной системой — нет доступа к системам и API. Вход через eGov и ЭЦП — нужны договор и сертификация. Оплата долга — отдельная защита и согласование с бухгалтерией. Мобильное приложение — веб уже под телефон, уведомления через Telegram."],
["4. Требования и MoSCoW", "Could и Won't — в чём разница?", "Could сделаем, если будет время. Won't сознательно исключили из этой версии и записали причину."],
["4. Требования и MoSCoW", "Какие NFR — Must?", "NFR-01 Argon2id, NFR-02 сессии, NFR-03 права из сессии, NFR-04 лимиты частоты, NFR-05 целостность в базе, NFR-06 единый формат ошибок, NFR-07 CSRF, NFR-08 Telegram не откатывает отметку."],
["4. Требования и MoSCoW", "Какие NFR — Should?", "NFR-09 телефон и WCAG 2.1 AA, NFR-10 пагинация, NFR-11 переменные окружения, HTTPS и заголовки, NFR-12 слои фронтенда."],
["4. Требования и MoSCoW", "Почему автозакрытие (FR-12) — Must?", "Без него лист не становится документом: его можно «поправить» после выдачи. Трудоёмкость — 1 день."],
["4. Требования и MoSCoW", "Почему публичная проверка (FR-14) — Must?", "Решает проблему подделки: без неё нет доверия к PDF. 1 день."],
["4. Требования и MoSCoW", "Почему массовая отметка (FR-10) — Should?", "Экономит часы в сезон выпуска, но и по одной отметке процесс идёт. 1 день."],
["4. Требования и MoSCoW", "Почему импорт CSV (FR-20) — Should?", "Сотни студентов за минуту. Без него — ввод по одному и ошибки, но процесс работает. 2 дня."],
["4. Требования и MoSCoW", "Почему Telegram (FR-23) — Should?", "Студент узнаёт о долге без входа. Без него студент проверяет кабинет сам. 2 дня."],
["4. Требования и MoSCoW", "Почему сводка задержек (FR-25) — Could?", "Полезно видеть, какой отдел тормозит, но это 3 дня, а аналитику можно сделать вручную по журналу."],
["4. Требования и MoSCoW", "Почему интеграция с 1С — Won't?", "Убрала бы ручной ввод долгов, но это недели работы и нужен доступ к системе колледжа."],
["4. Требования и MoSCoW", "Все ли Should реализованы?", "Да, все Must и Should реализованы. Не сделаны только Could: FR-25 и FR-26."],
["4. Требования по одному", "Пользователь входит по логину и паролю, выданным учебной частью. Сессия хранится в cookie HttpOnly.\nКакой приоритет и как проверить?", "Must, FR-01.\nПриёмка: Верный пароль открывает кабинет своей роли; неверный даёт «Неверный логин или пароль» без уточнения причины."],
["4. Требования по одному", "После выдачи временного пароля пользователь обязан сменить его при первом входе.\nКакой приоритет и как проверить?", "Must, FR-02.\nПриёмка: Пока пароль не сменён, любой экран ведёт на смену пароля."],
["4. Требования по одному", "Пользователь меняет свой пароль, указав текущий.\nКакой приоритет и как проверить?", "Should, FR-03.\nПриёмка: Без верного текущего пароля смена отклоняется; новый короче 8 символов отклоняется."],
["4. Требования по одному", "Учебная часть открывает студенту лист одного из пяти типов.\nКакой приоритет и как проверить?", "Must, FR-04.\nПриёмка: Лист появляется в списке со статусом «создан» и номером ГГГГ-NNNN."],
["4. Требования по одному", "У студента не может быть двух открытых листов одного типа.\nКакой приоритет и как проверить?", "Must, FR-05.\nПриёмка: Повторное открытие даёт ошибку duplicate, второй лист не создаётся."],
["4. Требования по одному", "При открытии в лист копируются отделы из шаблона типа.\nКакой приоритет и как проверить?", "Must, FR-06.\nПриёмка: Отметки листа совпадают с шаблоном на момент открытия, все в состоянии «ожидает»."],
["4. Требования по одному", "Сотрудник видит очередь своего отдела: вкладки «Ожидают», «Есть задолженность», «Отмечены», поиск по ФИО, группе, номеру.\nКакой приоритет и как проверить?", "Must, FR-07.\nПриёмка: Сотрудник библиотеки не видит листы, в которые библиотека не входит."],
["4. Требования по одному", "Сотрудник ставит отметку «нет задолженности».\nКакой приоритет и как проверить?", "Must, FR-08.\nПриёмка: Отметка сохраняется с автором и временем; описание и срок долга стираются."],
["4. Требования по одному", "Сотрудник ставит «есть задолженность» с описанием (1–200 символов) и необязательным сроком не раньше сегодня.\nКакой приоритет и как проверить?", "Must, FR-09.\nПриёмка: Пустое описание, описание длиннее 200 символов и срок в прошлом отклоняются с понятным текстом."],
["4. Требования по одному", "Сотрудник отмечает «нет задолженности» сразу у нескольких листов.\nКакой приоритет и как проверить?", "Should, FR-10.\nПриёмка: Ошибка по одному листу не отменяет отметки на остальных, неудачные листы показаны списком."],
["4. Требования по одному", "Студент видит свои листы, статус по каждому отделу, описание и срок долга.\nКакой приоритет и как проверить?", "Must, FR-11.\nПриёмка: Долг, поставленный отделом, виден студенту после обновления страницы."],
["4. Требования по одному", "Лист закрывается автоматически, когда все отметки «нет задолженности». Закрытый лист не меняется.\nКакой приоритет и как проверить?", "Must, FR-12.\nПриёмка: Последняя отметка закрывает лист; любая попытка изменить закрытый лист даёт closed."],
["4. Требования по одному", "Закрытый лист печатается в PDF с QR-кодом и ссылкой на проверку.\nКакой приоритет и как проверить?", "Must, FR-13.\nПриёмка: QR-код на печатной форме открывает страницу проверки именно этого листа."],
["4. Требования по одному", "Публичная страница проверки по номеру листа без входа показывает минимум данных.\nКакой приоритет и как проверить?", "Must, FR-14.\nПриёмка: Для закрытого листа видны номер, тип, дата закрытия, отделы и короткое имя; ФИО полностью, группа и долги не видны."],
["4. Требования по одному", "Открытие листа и каждое изменение отметки пишутся в журнал.\nКакой приоритет и как проверить?", "Must, FR-15.\nПриёмка: В журнале есть запись с автором, временем, отделом и действием; отметка без изменений записи не создаёт."],
["4. Требования по одному", "Учебная часть просматривает журнал с поиском по номеру листа.\nКакой приоритет и как проверить?", "Should, FR-16.\nПриёмка: Ввод 0142 находит записи листа 2026-0142."],
["4. Требования по одному", "Учебная часть видит сводку: открыто, из них с долгом, закрыто в текущем году.\nКакой приоритет и как проверить?", "Should, FR-17.\nПриёмка: Числа совпадают с количеством листов в соответствующих вкладках."],
["4. Требования по одному", "Учебная часть видит все листы с фильтрами по статусу, типу и поиском.\nКакой приоритет и как проверить?", "Must, FR-18.\nПриёмка: Фильтр «Есть задолженность» показывает только листы с хотя бы одним долгом."],
["4. Требования по одному", "Учебная часть добавляет студента и меняет его ФИО или группу.\nКакой приоритет и как проверить?", "Must, FR-19.\nПриёмка: Новый студент получает логин и временный пароль, показанный один раз."],
["4. Требования по одному", "Учебная часть импортирует студентов из CSV (до 2 МБ, 2000 строк).\nКакой приоритет и как проверить?", "Should, FR-20.\nПриёмка: Хорошие строки создаются, плохие попадают в отчёт с номером строки и причиной; ячейки, начинающиеся с =, +, -, @, отклоняются."],
["4. Требования по одному", "Учебная часть заводит сотрудников, назначает отдел, блокирует и сбрасывает пароль.\nКакой приоритет и как проверить?", "Must, FR-21.\nПриёмка: Заблокированный сотрудник не может войти, его сессии завершены; себя заблокировать нельзя."],
["4. Требования по одному", "Учебная часть настраивает, какие отделы входят в лист каждого типа.\nКакой приоритет и как проверить?", "Should, FR-22.\nПриёмка: Пустой шаблон не сохраняется; изменение шаблона не меняет уже открытые листы."],
["4. Требования по одному", "Студент привязывает Telegram и получает сообщения о долге и о закрытии листа.\nКакой приоритет и как проверить?", "Should, FR-23.\nПриёмка: После /start <код> в боте аккаунт привязан; сообщение «нет задолженности» не отправляется."],
["4. Требования по одному", "Интерфейс на русском и казахском с переключателем.\nКакой приоритет и как проверить?", "Should, FR-24.\nПриёмка: Все экраны, включая тексты ошибок и даты, переводятся без перезагрузки."],
["4. Требования по одному", "Сводка задержек по отделам: среднее время отметки, самые долгие листы.\nКакой приоритет и как проверить?", "Could, FR-25.\nПриёмка: Не реализовано, перенесено в следующую версию."],
["4. Требования по одному", "Напоминание студенту и отделу о приближении срока долга.\nКакой приоритет и как проверить?", "Could, FR-26.\nПриёмка: Не реализовано, перенесено в следующую версию."],
["4. Требования по одному", "Пароли хранятся только как хеш Argon2id, открытый пароль не пишется в базу и логи.\nКакой приоритет и как проверить?", "Must, NFR-01.\nПриёмка: В таблице users нет открытых паролей; тест password_test.go проходит."],
["4. Требования по одному", "Токен сессии: 32 случайных байта, в базе только SHA-256. Срок 12 часов с продлением, максимум 7 дней.\nКакой приоритет и как проверить?", "Must, NFR-02.\nПриёмка: Через 12 часов бездействия запрос даёт 401."],
["4. Требования по одному", "Роль и отдел берутся из сессии, не из запроса. Объект без доступа отдаётся как 404.\nКакой приоритет и как проверить?", "Must, NFR-03.\nПриёмка: Сотрудник, подставивший чужой отдел в URL, получает 403."],
["4. Требования по одному", "Ограничение частоты: вход 5 неудач за 15 минут на пару IP и логин, проверка 30 запросов в минуту на IP, импорт 5 раз в час.\nКакой приоритет и как проверить?", "Must, NFR-04.\nПриёмка: Шестая неудачная попытка входа даёт 429 с заголовком Retry-After."],
["4. Требования по одному", "Целостность данных: изменения отметки, журнала и закрытия листа в одной транзакции; ограничения CHECK и уникальный индекс в базе.\nКакой приоритет и как проверить?", "Must, NFR-05.\nПриёмка: Попытка записать долг без описания отклоняется самой базой."],
["4. Требования по одному", "Ошибки в одном формате {error: {code, message, field}}, без стека и SQL.\nКакой приоритет и как проверить?", "Must, NFR-06.\nПриёмка: Ответ 500 содержит только код server."],
["4. Требования по одному", "Защита от CSRF: SameSite=Lax и обязательный заголовок X-Requested-With на изменяющих запросах.\nКакой приоритет и как проверить?", "Must, NFR-07.\nПриёмка: POST без заголовка получает 403."],
["4. Требования по одному", "Ошибка Telegram не отменяет отметку, отправка идёт после коммита.\nКакой приоритет и как проверить?", "Must, NFR-08.\nПриёмка: При недоступном Telegram отметка сохраняется."],
["4. Требования по одному", "Кабинет студента удобен на телефоне, интерфейс соответствует WCAG 2.1 AA по контрасту и клавиатурной навигации.\nКакой приоритет и как проверить?", "Should, NFR-09.\nПриёмка: Экран студента читается без горизонтальной прокрутки на ширине телефона; все действия доступны с клавиатуры."],
["4. Требования по одному", "Списки отдаются страницами: pageSize 1–100, по умолчанию 25.\nКакой приоритет и как проверить?", "Should, NFR-10.\nПриёмка: Запрос pageSize=500 отклоняется."],
["4. Требования по одному", "Настройка через переменные окружения, HTTPS, заголовки HSTS, nosniff, Referrer-Policy.\nКакой приоритет и как проверить?", "Should, NFR-11.\nПриёмка: Ответы API содержат три заголовка безопасности."],
["4. Требования по одному", "Фронтенд разделён на слои domain, application, infrastructure, presentation; зависимости направлены только внутрь.\nКакой приоритет и как проверить?", "Should, NFR-12.\nПриёмка: Тест architecture.test.ts проходит."],
["5. Сценарии", "Что такое пользовательский сценарий и из чего он состоит?", "Описание шаг за шагом: что делает пользователь, как реагирует система и какие ошибки возможны. Всего 8 сценариев, С1–С8."],
["5. Сценарии", "С1 — учебная часть открывает лист.", "Выбирает студента и тип → система проверяет, что такого открытого листа нет, копирует отделы из шаблона, даёт номер, пишет журнал. Ошибки: лист уже открыт (duplicate), студент не найден."],
["5. Сценарии", "С2 — отдел ставит отметку.", "Очередь «Ожидают» → поиск студента → «нет задолженности» или долг с описанием и сроком → проверка отдела по сессии → сохранение и журнал → последняя отметка закрывает лист. Ошибки: пустое или длинное описание, срок в прошлом, лист закрыт."],
["5. Сценарии", "С3 — массовая отметка.", "Сотрудник отмечает галочками несколько листов → каждый обрабатывается отдельно → итог: сколько отмечено и какие не прошли, например успевший закрыться."],
["5. Сценарии", "С4 — студент следит за листом.", "Видит строку по каждому отделу с состоянием; у долга — описание и срок; сообщение в Telegram приходит сразу. Закрывает долг, отдел меняет отметку."],
["5. Сценарии", "С5 — студент получает документ.", "После закрытия появляются печатная форма, QR-код и «Скачать PDF» (печать браузера). В Telegram — номер листа и ссылка на проверку."],
["5. Сценарии", "С6 — проверка подлинности.", "Сканирует QR → /verify/номер. Закрытый — «Подлинный», номер, тип, дата, отделы. Незакрытый — «найден, но не закрыт». Нет такого — «Лист не найден». Больше 30 запросов в минуту с IP — 429."],
["5. Сценарии", "С7 — первый вход.", "Логин и временный пароль от учебной части → система сразу требует новый пароль от 8 символов. До смены другие экраны закрыты."],
["5. Сценарии", "С8 — импорт студентов.", "CSV с колонками name, group, login, разделитель ; или , → хорошие строки создаются, плохие показаны с номером и причиной → файл с временными паролями. Сервер пароли не хранит."],
["6. Изменения", "Зачем управлять изменениями требований?", "Чтобы любое изменение было записано, оценено по влиянию и одновременно попало в требования, спецификацию, план и код. Иначе документ и система расходятся."],
["6. Изменения", "Порядок изменения требований (5 шагов)?", "1 регистрация: issue с меткой change-request; 2 оценка влияния — Зарина за 2 рабочих дня; 3 решение команды; 4 обновление одним pull request: требование, спецификация, доска, код; 5 запись в журнал изменений."],
["6. Изменения", "Что оценивают при изменении?", "Сроки (сдвигается ли сдача), объём работ, функциональность (не ломается ли Must), данные (нужна ли миграция), безопасность (не раскрываются ли данные)."],
["6. Изменения", "Когда изменение согласуют с руководителем?", "Если оно сдвигает срок сдачи или затрагивает Must."],
["6. Изменения", "Какие изменения были в проекте?", "29.10 — бренд «Белгі» заменён на AITU. 02.11 — убрали Telegram на «нет задолженности». 04.11 — исправлен импорт CSV с кавычкой и казахские даты."],
["6. Изменения", "Почему убрали сообщение «нет задолженности»?", "В сезон выпуска студент получал бы до шести сообщений в день. FR-23 сузили до долга и закрытия."],

const SECTIONS = ["Все", ...new Set(DATA.map(d => d[0]))];
const KEY = "aitu-flashcards-v2";
const store = {
  get() { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch { return new Set(); } },
  set(s) { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch {} },
};
let known = store.get();
let section = "Все", order = DATA.map((_, i) => i), queue = [], current = null, flipped = false;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

function inSection(i) { return section === "Все" || DATA[i][0] === section; }

function buildQueue() {
  queue = order.filter(i => inSection(i) && (!$("onlyNew").checked || !known.has(i)));
  next();
}

function next() { current = queue.length ? queue.shift() : null; flipped = false; render(); }

function render() {
  const total = order.filter(inSection).length;
  const learned = order.filter(i => inSection(i) && known.has(i)).length;
  $("count").textContent = `Выучено ${learned} из ${total}`;
  $("progressFill").style.width = total ? `${learned / total * 100}%` : "0";
  if (current === null) {
    $("stage").innerHTML = `<div class="card done"><div class="q">Карточки в этой подборке закончились</div>
      <div class="hint">Сними «только невыученные», чтобы пройти всё ещё раз, или выбери другой раздел.</div></div>`;
    return;
  }
  const [sec, q, a] = DATA[current];
  $("stage").innerHTML = `
    <div class="card" id="card" role="button" tabindex="0" aria-label="Показать ответ">
      <div class="sec">${esc(sec)}${known.has(current) ? '<span class="mark">выучено</span>' : ""}</div>
      <div class="q">${esc(q)}</div>
      ${flipped ? `<div class="a">${esc(a)}</div>` : `<div class="hint">Ответь вслух, потом нажми, чтобы проверить.</div>`}
    </div>
    ${flipped ? `<div class="actions"><button class="btn again" id="again">Ещё раз</button><button class="btn ok" id="ok">Знаю</button></div>` : ""}`;
  $("card").onclick = () => { flipped = !flipped; render(); };
  if (flipped) { $("again").onclick = again; $("ok").onclick = ok; }
}

function ok() { known.add(current); store.set(known); next(); }
function again() {
  known.delete(current); store.set(known);
  queue.splice(Math.min(3, queue.length), 0, current);  // вернётся через пару карточек
  next();
}

function renderChips() {
  $("chips").innerHTML = SECTIONS.map(s => `<button class="chip" aria-pressed="${s === section}">${esc(s)}</button>`).join("");
  [...$("chips").children].forEach((b, k) => b.onclick = () => { section = SECTIONS[k]; renderChips(); buildQueue(); renderList(); });
}

function renderList() {
  let html = "", last = "";
  DATA.forEach(([sec, q, a], i) => {
    if (!inSection(i)) return;
    if (sec !== last) { html += `<h2>${esc(sec)}</h2>`; last = sec; }
    html += `<details><summary>${esc(q)}${known.has(i) ? '<span class="mark">выучено</span>' : ""}</summary><p>${esc(a)}</p></details>`;
  });
  $("listView").innerHTML = html;
}

function setTab(list) {
  $("tabCards").setAttribute("aria-pressed", !list); $("tabList").setAttribute("aria-pressed", list);
  $("cardsView").hidden = list; $("listView").hidden = !list;
  if (list) renderList();
}

$("tabCards").onclick = () => setTab(false);
$("tabList").onclick = () => setTab(true);
$("onlyNew").onchange = buildQueue;
$("shuffle").onclick = () => { order.sort(() => Math.random() - .5); buildQueue(); };
$("reset").onclick = () => { if (confirm("Сбросить отметки «выучено»?")) { known = new Set(); store.set(known); buildQueue(); } };
document.addEventListener("keydown", e => {
  if ($("cardsView").hidden || current === null || e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); flipped = !flipped; render(); }
  else if (e.key === "ArrowRight" && flipped) ok();
  else if (e.key === "ArrowLeft" && flipped) again();
});

renderChips();
buildQueue();
</script>
</body>
</html>
