<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обходной лист: карточки</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1b1b1b; --muted: #6b6b6b; --line: #d9d9d4;
  --accent: #001c46; --ok: #2f6b3a; --again: #8a3b12; --chip: #ecece8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151515; --card: #1f1f1f; --text: #ececec; --muted: #9a9a9a; --line: #333;
          --accent: #9cc3f5; --ok: #7fbf8a; --again: #e39a6e; --chip: #2a2a2a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
.tab { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 6px; }
.tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid transparent; background: var(--chip); padding: 4px 10px; border-radius: 999px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.bar label { display: flex; align-items: center; gap: 6px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
.progress div { height: 100%; background: var(--ok); width: 0; transition: width .2s; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px 20px;
        min-height: 260px; display: flex; flex-direction: column; cursor: pointer; user-select: none; }
.card .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card .q { font-size: 20px; font-weight: 600; margin: 12px 0; }
.card .a { font-size: 17px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; white-space: pre-line; }
.card .hint { color: var(--muted); font-size: 14px; margin-top: auto; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 12px; border-radius: 8px; font-weight: 600; }
.btn.again { color: var(--again); } .btn.ok { color: var(--ok); }
.small { border: none; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; }
.done { text-align: center; padding: 40px 0; }
.list details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
.list summary { cursor: pointer; font-weight: 600; }
.list p { margin: 8px 0 0; white-space: pre-line; }
.list h2 { font-size: 15px; color: var(--muted); margin: 20px 0 8px; }
.keys { color: var(--muted); font-size: 13px; margin-top: 16px; }
.mark { font-size: 12px; margin-left: 6px; color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Электронный обходной лист: подготовка к защите</h1>
  <p class="sub">Карточки по всему проекту: проблема, требования, архитектура, база, безопасность, план. Нажми на карточку, чтобы увидеть ответ.</p>

  <div class="tabs">
    <button class="tab" id="tabCards" aria-pressed="true">Карточки</button>
    <button class="tab" id="tabList" aria-pressed="false">Все вопросы</button>
  </div>
  <div class="chips" id="chips"></div>

  <section id="cardsView">
    <div class="bar">
      <span id="count"></span>
      <label><input type="checkbox" id="onlyNew" checked> только невыученные</label>
      <button class="small" id="shuffle">перемешать</button>
      <button class="small" id="reset">сбросить прогресс</button>
    </div>
    <div class="progress"><div id="progressFill"></div></div>
    <div id="stage"></div>
    <p class="keys">Клавиши: пробел — показать ответ, → знаю, ← ещё раз.</p>
  </section>

  <section id="listView" class="list" hidden></section>
</main>

<script>
const DATA = [
// [раздел, вопрос, ответ]
["Проект", "Что за проект одной фразой?", "Веб-система вместо бумажного обходного листа колледжа AITU. Отделы ставят отметки одновременно, студент видит, кто его держит, закрытый лист проверяется по QR-коду."],
["Проект", "Когда студенту нужен обходной лист? Сколько типов листа?", "5 типов: выпуск, отчисление, перевод, академический отпуск, выселение из общежития."],
["Проект", "Какие 6 отделов ставят отметки?", "Библиотека, бухгалтерия, общежитие, военно-учётный стол, IT-отдел, учебная часть."],
["Проект", "Главная боль студента сейчас?", "Узнаёт о долге у двери кабинета и обходит 5–7 кабинетов, часто по несколько раз."],
["Проект", "Сколько проблем нашли? Назови хотя бы пять.", "9. Долг у двери; сотрудника нет на месте; отдел не знает заранее; нет статуса; бланк теряют и подделывают; нет истории; нет напоминаний; подлинность на глаз; нет сводки."],
["Проект", "Кто пользователи системы?", "Студент, сотрудник отдела, учебная часть (администратор) и проверяющий без аккаунта: отдел кадров, другой колледж, работодатель."],
["Проект", "Почему такого сервиса ещё нет?", "В колледжах Казахстана eGov и цифровые билеты уже есть, а обходной лист остался бумажным."],
["Проект", "Это официальный сервис AITU?", "Нет, учебный (дипломный) проект. Чтобы публиковать с логотипом, нужно согласие колледжа."],
["Проект", "На каких языках интерфейс?", "Русский и казахский, с переключателем."],

["Цель", "Цель проекта?", "Заменить бумажный лист электронным: меньше времени и визитов, долги видны заранее, лист проверяется без звонков и печатей."],
["Цель", "SMART-цель коротко?", "До 5 ноября 2026 показать прототип: 5 типов листа, 6 отделов, статус в кабинете и Telegram, PDF с QR и проверка. Без обхода кабинетов."],
["Цель", "Что в SMART измеримо (M)?", "5 типов листа, 6 отделов, все Must проходят критерии приёмки, сценарий проходит без визитов в отделы без долга."],
["Цель", "Почему цель достижима (A)?", "4 человека, минимальный набор функций (MVP), знакомый стек, без интеграций с 1С и eGov."],
["Цель", "Есть цифры «до внедрения»?", "Нет. Соберём опросом выпускников. Пока цифры — цели, а не результаты, и это честно написано."],
["Цель", "Какие результаты ждём?", "Студент ходит только в отделы с долгом, отметки ставятся дистанционно, учебная часть видит статус, проверка по QR за секунды, всё в журнале, бумага не нужна."],

["Процесс", "Как называется основной бизнес-процесс?", "«Оформление обходного листа при прекращении или изменении статуса обучения студента»."],
["Процесс", "AS-IS в трёх шагах?", "Учебная часть выдаёт бумажный бланк → студент сам обходит кабинеты по очереди и узнаёт о долгах на месте → сдаёт бланк обратно."],
["Процесс", "TO-BE в трёх шагах?", "Учебная часть открывает лист в системе → все отделы отмечают параллельно, студент видит долги → последняя отметка закрывает лист, PDF с QR."],
["Процесс", "Главное отличие TO-BE от AS-IS?", "Последовательный обход стал параллельными отметками. Студент идёт только туда, где долг."],
["Процесс", "Что происходит, когда все отделы поставили «нет задолженности»?", "Лист закрывается сам в той же транзакции. После этого его менять нельзя."],
["Процесс", "Как проверяющий убеждается, что лист настоящий?", "Сканирует QR → открывается /verify/номер → видит «Подлинный», номер, тип, дату закрытия и отделы."],

["Стейкхолдеры", "У кого высокое влияние на проект?", "Студент, учебная часть, администрация колледжа, руководитель проекта, команда."],
["Стейкхолдеры", "Что нужно отделам и как это учтено?", "Видеть листы заранее, отмечать быстро, трогать только своё. Есть очередь с вкладками и поиском, массовая отметка и доступ только к своему отделу."],
["Стейкхолдеры", "Что нужно учебной части?", "Контроль статусов, меньше рутины. Есть список листов с фильтрами, сводка, импорт студентов из CSV и шаблоны."],
["Стейкхолдеры", "Что нужно проверяющему?", "Быстро проверить подлинность. Публичная страница по QR без входа и с минимумом данных."],
["Стейкхолдеры", "Как показать, что требования сторон учтены?", "Таблица «потребность → требование» (раздел 3.3): у каждой потребности указан номер требования."],

["Сбор требований", "Какие методы сбора требований?", "Интервью, анализ документов (бумажный бланк), наблюдение и опыт студентов, анализ аналогов."],
["Сбор требований", "С кем интервью?", "Библиотека, бухгалтерия, учебная часть."],
["Сбор требований", "Интервью настоящие?", "Нет, смоделированные, и в документе это сказано прямо. Перед внедрением их надо провести вживую."],
["Сбор требований", "Что дала библиотека?", "Долг — это книга и срок. В сезон сотни листов, поэтому нужна массовая отметка. Чужие отделы не должны менять нашу отметку."],
["Сбор требований", "Что дала бухгалтерия?", "Сумму долга не видят посторонние. Нужен журнал: кто и когда поставил отметку. 1С пока нет, отмечаем вручную."],
["Сбор требований", "Что дала учебная часть?", "У разных типов разные отделы. Шаблон не трогает открытые листы. Студентов заводить списком. Не два листа одного типа. Проверяющему — минимум данных."],

["Требования", "Сколько требований?", "38: 26 функциональных (FR) и 12 нефункциональных (NFR)."],
["Требования", "FR и NFR — в чём разница?", "FR — что система делает. NFR — как: безопасность, надёжность, удобство, ограничения."],
["Требования", "Что такое MoSCoW?", "Must — без этого цели нет. Should — сильно помогает, но можно без него. Could — если будет время. Won't — сознательно не делаем."],
["Требования", "Как расставляли приоритеты?", "Три вопроса: решает ли проблему, сколько стоит сделать, какой риск снимает. Доверие к листу и защита данных — всегда Must."],
["Требования", "Что входит в MVP?", "Все Must: вход и смена пароля, открытие листа, отметки и долги, кабинет студента, автозакрытие, PDF с QR, проверка, журнал, справочники, защита данных."],
["Требования", "Назови три Should.", "Массовая отметка, импорт CSV, Telegram. А ещё шаблоны, казахский язык, сводка, поиск по журналу, смена пароля."],
["Требования", "Что в Could? Сделано?", "FR-25 — сводка задержек по отделам, FR-26 — напоминания о сроке долга. Не сделаны, перенесены."],
["Требования", "Что в Won't и почему?", "1С и библиотечная система — нет доступа. eGov и ЭЦП — договоры и сертификация. Оплата в системе. Мобильное приложение — веб уже под телефон."],
["Требования", "Пример FR с критерием приёмки.", "FR-09: долг с описанием 1–200 символов и сроком не раньше сегодня. Приёмка: пустое описание, длиннее 200 символов и прошлый срок отклоняются."],
["Требования", "Пример NFR.", "NFR-04: после 5 неудачных входов за 15 минут — ответ 429. Или NFR-01: пароли только как хеш Argon2id."],
["Требования", "Почему автозакрытие — Must?", "Без него лист не становится документом, и его можно «поправить» после выдачи."],
["Требования", "Почему массовая отметка — Should, а не Must?", "Экономит часы в сезон выпуска, но и по одной отметке процесс работает."],
["Требования", "FR-05?", "У студента не может быть двух открытых листов одного типа. Иначе ошибка duplicate."],
["Требования", "FR-14 — что видно на публичной проверке?", "Номер, тип, дата закрытия, отделы, короткое имя. Полного ФИО, группы и долгов — нет."],

["Требования FR", "Номер, приоритет и критерий приёмки: «Пользователь входит по логину и паролю, выданным учебной частью. Сессия хранится в cookie HttpOnly»", "FR-01, Must.\nПриёмка: Верный пароль открывает кабинет своей роли; неверный даёт «Неверный логин или пароль» без уточнения причины."],
["Требования FR", "Номер, приоритет и критерий приёмки: «После выдачи временного пароля пользователь обязан сменить его при первом входе»", "FR-02, Must.\nПриёмка: Пока пароль не сменён, любой экран ведёт на смену пароля."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Пользователь меняет свой пароль, указав текущий»", "FR-03, Should.\nПриёмка: Без верного текущего пароля смена отклоняется; новый короче 8 символов отклоняется."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Учебная часть открывает студенту лист одного из пяти типов»", "FR-04, Must.\nПриёмка: Лист появляется в списке со статусом «создан» и номером ГГГГ-NNNN."],
["Требования FR", "Номер, приоритет и критерий приёмки: «У студента не может быть двух открытых листов одного типа»", "FR-05, Must.\nПриёмка: Повторное открытие даёт ошибку duplicate, второй лист не создаётся."],
["Требования FR", "Номер, приоритет и критерий приёмки: «При открытии в лист копируются отделы из шаблона типа»", "FR-06, Must.\nПриёмка: Отметки листа совпадают с шаблоном на момент открытия, все в состоянии «ожидает»."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Сотрудник видит очередь своего отдела: вкладки «Ожидают», «Есть задолженность», «Отмечены», поиск по ФИО, группе, номеру»", "FR-07, Must.\nПриёмка: Сотрудник библиотеки не видит листы, в которые библиотека не входит."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Сотрудник ставит отметку «нет задолженности»»", "FR-08, Must.\nПриёмка: Отметка сохраняется с автором и временем; описание и срок долга стираются."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Сотрудник ставит «есть задолженность» с описанием (1–200 символов) и необязательным сроком не раньше сегодня»", "FR-09, Must.\nПриёмка: Пустое описание, описание длиннее 200 символов и срок в прошлом отклоняются с понятным текстом."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Сотрудник отмечает «нет задолженности» сразу у нескольких листов»", "FR-10, Should.\nПриёмка: Ошибка по одному листу не отменяет отметки на остальных, неудачные листы показаны списком."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Студент видит свои листы, статус по каждому отделу, описание и срок долга»", "FR-11, Must.\nПриёмка: Долг, поставленный отделом, виден студенту после обновления страницы."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Лист закрывается автоматически, когда все отметки «нет задолженности». Закрытый лист не меняется»", "FR-12, Must.\nПриёмка: Последняя отметка закрывает лист; любая попытка изменить закрытый лист даёт closed."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Закрытый лист печатается в PDF с QR-кодом и ссылкой на проверку»", "FR-13, Must.\nПриёмка: QR-код на печатной форме открывает страницу проверки именно этого листа."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Публичная страница проверки по номеру листа без входа показывает минимум данных»", "FR-14, Must.\nПриёмка: Для закрытого листа видны номер, тип, дата закрытия, отделы и короткое имя; ФИО полностью, группа и долги не видны."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Открытие листа и каждое изменение отметки пишутся в журнал»", "FR-15, Must.\nПриёмка: В журнале есть запись с автором, временем, отделом и действием; отметка без изменений записи не создаёт."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Учебная часть просматривает журнал с поиском по номеру листа»", "FR-16, Should.\nПриёмка: Ввод 0142 находит записи листа 2026-0142."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Учебная часть видит сводку: открыто, из них с долгом, закрыто в текущем году»", "FR-17, Should.\nПриёмка: Числа совпадают с количеством листов в соответствующих вкладках."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Учебная часть видит все листы с фильтрами по статусу, типу и поиском»", "FR-18, Must.\nПриёмка: Фильтр «Есть задолженность» показывает только листы с хотя бы одним долгом."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Учебная часть добавляет студента и меняет его ФИО или группу»", "FR-19, Must.\nПриёмка: Новый студент получает логин и временный пароль, показанный один раз."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Учебная часть импортирует студентов из CSV (до 2 МБ, 2000 строк)»", "FR-20, Should.\nПриёмка: Хорошие строки создаются, плохие попадают в отчёт с номером строки и причиной; ячейки, начинающиеся с =, +, -, @, отклоняются."],
["Требования FR", "Номер, приоритет и критерий приёмки: «Учебная часть заводит сотрудников, назначает отдел, блокирует и сбрасывает пароль»", "FR-21, Must.\nПриёмка: Заблокированный сотрудник не может войти, его сессии завершены; себя заблокировать нельзя."],

["Изменения", "Пример возможного изменения?", "Бухгалтерия хочет сумму отдельным полем: новая колонка в базе, правка FR-09 и FR-14, около 2 дней, отдельная миграция после сдачи."],

const SECTIONS = ["Все", ...new Set(DATA.map(d => d[0]))];
const KEY = "aitu-flashcards-known";
const store = {
  get() { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch { return new Set(); } },
  set(s) { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch {} },
};
let known = store.get();
let section = "Все", order = DATA.map((_, i) => i), queue = [], current = null, flipped = false;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

function inSection(i) { return section === "Все" || DATA[i][0] === section; }

function buildQueue() {
  queue = order.filter(i => inSection(i) && (!$("onlyNew").checked || !known.has(i)));
  next();
}

function next() { current = queue.length ? queue.shift() : null; flipped = false; render(); }

function render() {
  const total = order.filter(inSection).length;
  const learned = order.filter(i => inSection(i) && known.has(i)).length;
  $("count").textContent = `Выучено ${learned} из ${total}`;
  $("progressFill").style.width = total ? `${learned / total * 100}%` : "0";
  if (current === null) {
    $("stage").innerHTML = `<div class="card done"><div class="q">Карточки в этой подборке закончились</div>
      <div class="hint">Сними «только невыученные», чтобы пройти всё ещё раз, или выбери другой раздел.</div></div>`;
    return;
  }
  const [sec, q, a] = DATA[current];
  $("stage").innerHTML = `
    <div class="card" id="card" role="button" tabindex="0" aria-label="Показать ответ">
      <div class="sec">${esc(sec)}${known.has(current) ? '<span class="mark">выучено</span>' : ""}</div>
      <div class="q">${esc(q)}</div>
      ${flipped ? `<div class="a">${esc(a)}</div>` : `<div class="hint">Ответь вслух, потом нажми, чтобы проверить.</div>`}
    </div>
    ${flipped ? `<div class="actions"><button class="btn again" id="again">Ещё раз</button><button class="btn ok" id="ok">Знаю</button></div>` : ""}`;
  $("card").onclick = () => { flipped = !flipped; render(); };
  if (flipped) { $("again").onclick = again; $("ok").onclick = ok; }
}

function ok() { known.add(current); store.set(known); next(); }
function again() {
  known.delete(current); store.set(known);
  queue.splice(Math.min(3, queue.length), 0, current);  // вернётся через пару карточек
  next();
}

function renderChips() {
  $("chips").innerHTML = SECTIONS.map(s => `<button class="chip" aria-pressed="${s === section}">${esc(s)}</button>`).join("");
  [...$("chips").children].forEach((b, k) => b.onclick = () => { section = SECTIONS[k]; renderChips(); buildQueue(); renderList(); });
}

function renderList() {
  let html = "", last = "";
  DATA.forEach(([sec, q, a], i) => {
    if (!inSection(i)) return;
    if (sec !== last) { html += `<h2>${esc(sec)}</h2>`; last = sec; }
    html += `<details><summary>${esc(q)}${known.has(i) ? '<span class="mark">выучено</span>' : ""}</summary><p>${esc(a)}</p></details>`;
  });
  $("listView").innerHTML = html;
}

function setTab(list) {
  $("tabCards").setAttribute("aria-pressed", !list); $("tabList").setAttribute("aria-pressed", list);
  $("cardsView").hidden = list; $("listView").hidden = !list;
  if (list) renderList();
}

$("tabCards").onclick = () => setTab(false);
$("tabList").onclick = () => setTab(true);
$("onlyNew").onchange = buildQueue;
$("shuffle").onclick = () => { order.sort(() => Math.random() - .5); buildQueue(); };
$("reset").onclick = () => { if (confirm("Сбросить отметки «выучено»?")) { known = new Set(); store.set(known); buildQueue(); } };
document.addEventListener("keydown", e => {
  if ($("cardsView").hidden || current === null || e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); flipped = !flipped; render(); }
  else if (e.key === "ArrowRight" && flipped) ok();
  else if (e.key === "ArrowLeft" && flipped) again();
});

renderChips();
buildQueue();
</script>
